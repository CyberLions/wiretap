services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspace:cached
    networks:
      - app-network
    ports:
      - "5010:8080"
      - "5011:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../backend/.env
      - ../frontend/.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
    command: sleep infinity

  db:
    image: mysql:8.4.0
    networks:
      - app-network
    env_file:
      - .db.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    networks:
      - app-network
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-msnAqX3KdoEti5k8Qgazn}
    ports:
      - "5012:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  app-network:
